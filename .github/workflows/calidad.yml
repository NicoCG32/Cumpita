name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Instalar dependencias fijadas
        run: bun install --frozen-lockfile
      - name: Verificar formato y análisis estático
        run: bun run lint
      - name: Verificar tipos
        run: bunx tsc --noEmit
      - name: Verificar distribución
        run: bun run test:release
      - name: Ejecutar pruebas
        run: bun run test
      - name: Compilar aplicación
        run: bun run build
